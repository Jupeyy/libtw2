[package]
name = "libtw2-httphook"
version = "0.0.1"
authors = ["heinrich5991 <heinrich5991@gmail.com>"]
license = "MIT/Apache-2.0"
edition = "2021"
rust-version = "1.63.0"

[dependencies]
env_logger = "0.10.2"
envy = "0.4.2"
libtw2-polyfill-1-63 = { path = "../polyfill-1-63/" }
libtw2-register = { path = "../register/" }
libtw2-serverbrowse = { path = "../serverbrowse/" }
log = "0.4.28"
reqwest = "0.12.9"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1.38.2", features = ["net", "rt", "time"] }
