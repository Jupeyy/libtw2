[package]
name = "libtw2-stats-browser"
version = "0.0.1"
authors = ["heinrich5991 <heinrich5991@gmail.com>"]
license = "MIT/Apache-2.0"
edition = "2021"
rust-version = "1.63.0"

[[bin]]
name = "libtw2-stats-browser"
doc = false

[dependencies]
arrayvec = { version = "0.7.6", features = ["serde"] }
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["deprecated"] }
libloc = { version = "0.1.1", default-features = false, features = ["compat-0-1-1"] }
libtw2-common = { path = "../common/" }
libtw2-logger = { path = "../logger/" }
libtw2-serverbrowse = { path = "../serverbrowse/" }
log = "0.4.28"
mio = { version = "0.8.11", features = ["net", "os-poll"] }
rand = "0.9.2"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.145"
time = "0.3.20"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5"] }
zerocopy = "0.8.27"
